<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoStock</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">T</span>
                <div>
                    <h1>TecnoStock</h1>
                    <p>Tecnología con estilo</p>
                </div>
            </div>
            <p class="header-cart">Tu carrito <span id="cart-count">0</span></p>
        </div>
    </header>
    <main>
        <section class="filter-panel">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">ENCUENTRA LO QUE BUSCAS</p>
                    <h2>Catálogo de productos</h2>
                </div>
                <button class="button button-secondary" type="button" id="clear-filters" disabled>
                    Limpiar filtros
                </button>
            </div>
            <div class="filters">
                <div class="filter-field search-field">
                    <label for="search">Buscar productos</label>
                    <input type="search" id="search" placeholder="Nombre o descripción" disabled>
                </div>
                <div class="filter-field">
                    <label for="category">Categoría</label>
                    <select id="category" disabled>
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="sort">Ordenar por precio</label>
                    <select id="sort" disabled>
                        <option value="">Sin ordenar</option>
                        <option value="asc">Menor a mayor</option>
                        <option value="desc">Mayor a menor</option>
                    </select>
                </div>
                <label class="availability" for="availability">
                    <input type="checkbox" id="availability" disabled>
                    <span>Solo disponibles</span>
                </label>
            </div>
        </section>
        <p id="catalog-status" role="status" aria-live="polite">Cargando catálogo...</p>
        <div class="store-layout">
            <section class="catalog-panel" aria-label="Productos disponibles">
                <product-list></product-list>
            </section>
            <aside class="cart-sidebar" id="cart-sidebar" aria-label="Carrito y resumen del pedido">
                <section class="cart-panel">
                    <div class="section-heading cart-heading">
                        <div>
                            <p class="eyebrow">TU SELECCIÓN</p>
                            <h2 id="cart-title">Carrito</h2>
                        </div>
                        <div class="cart-heading-actions">
                            <span class="cart-badge" aria-hidden="true">◆</span>
                            <button class="cart-close" type="button" id="close-cart" aria-label="Cerrar carrito">×</button>
                        </div>
                    </div>
                    <shopping-cart></shopping-cart>
                    <p id="cart-message" role="status" aria-live="polite"></p>
                    <button class="button button-secondary clear-cart" type="button" id="clear-cart" disabled>
                        Vaciar carrito
                    </button>
                </section>
                <section class="order-panel">
                    <p class="eyebrow">TOTAL DE TU PEDIDO</p>
                    <h2>Resumen</h2>
                    <div class="price-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
                    <div class="price-row"><span>Descuento</span><span id="discount">$0</span></div>
                    <div class="price-row total-row"><span>Total</span><strong id="total">$0</strong></div>
                    <button class="button button-primary confirm-button" type="button" id="confirm-order" disabled>
                        Confirmar pedido
                    </button>
                    <div id="order-message" role="status" aria-live="polite"></div>
                </section>
            </aside>
        </div>
    </main>
    <button class="mobile-cart-toggle" type="button" id="mobile-cart-toggle"
        aria-controls="cart-sidebar" aria-expanded="false">
        <span aria-hidden="true">◆</span> Ver carrito
        <span class="mobile-cart-count" id="mobile-cart-count">0</span>
    </button>
    <button class="cart-backdrop" type="button" id="cart-backdrop"
        aria-label="Cerrar carrito" tabindex="-1"></button>
</body>
</html>
